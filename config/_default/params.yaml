# Site settings for the Hugo Blox Bootstrap edition
# Docs: https://docs.hugoblox.com/

appearance:
  theme_day: academic_blue    # data/themes/academic_blue.toml
  theme_night: academic_blue
  font: academic              # data/fonts/academic.toml (Montserrat + Roboto)
  font_size: L

marketing:
  seo:
    site_type: Person
    description: 'Thomas Barnebeck Andersen, Professor of Economics, University of Southern Denmark.'
    twitter: ''
  analytics:
    google_analytics: ''

header:
  navbar:
    enable: true
    align: l
    show_logo: true   # shows the site title as the brand (no logo image)
    show_language: false
    show_day_night: false
    show_search: false
    highlight_active_link: true

footer:
  copyright:
    notice: '© {year} Thomas Barnebeck Andersen'
    license:
      enable: false

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'
  address_format: en-us

features:
  avatar:
    gravatar: false
    shape: circle
  math:
    enable: false
  privacy_pack:
    enable: false
  search:
    provider: ''

publications:
  date_format: January 2006
  citation_style: apa

power_ups:
  hide_published_with: false

extensions:
  academicons:
    enable: true   # needed for the Google Scholar icon
