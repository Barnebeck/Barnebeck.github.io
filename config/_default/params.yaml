# ══════════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION (schema v2) — Thomas Barnebeck Andersen
# Docs: https://docs.hugoblox.com/
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  identity:
    name: "Thomas Barnebeck Andersen"
    organization: "University of Southern Denmark"
    type: person
    tagline: "Professor of Economics"
    description: "Thomas Barnebeck Andersen, Professor of Economics at the University of Southern Denmark (SDU). Research in political economy, comparative economics, and macroeconomics."
    social:
      twitter: ""

  # Colours and dark mode. `mode: system` follows the visitor's OS setting.
  theme:
    mode: system
    pack: "default"
    colors:
      primary: "#0b6e99"   # restrained academic blue (close to the previous site's #006699)
      secondary: "#0b6e99"
      neutral: "slate"
    colors_light: {}
    colors_dark:
      primary: "#5fb4dc"
      secondary: "#5fb4dc"

  # Typography: the "modern" pack's sizes/spacing, with Inter for headings and body.
  # Inter is self-hosted (static/fonts/inter/) and wired up in
  # assets/css/hbx/blocks/shared/tba/fonts.css; "system-sans" here stops the theme loading its own (remote) font.
  typography:
    pack: "modern"
    families:
      heading: "system-sans"
      body: "system-sans"

  layout:
    radius: "md"
    spacing: "spacious"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: false
    theme_toggle: true      # lets visitors override the system light/dark setting
    theme_picker: false
    language_switcher: false
    cta:
      enable: false

  footer:
    style: minimal
    language_switcher: false
    text: ""

  copyright:
    notice: "© {year} Thomas Barnebeck Andersen"
    license:
      type: custom

  seo:
    title: ""
    location:
      address:
        street: "Campusvej 55"
        city: "Odense"
        region: ""
        postal_code: "DK-5230"
        country: "Denmark"
      coordinates:
        latitude: null
        longitude: null
      phone: "+45 24782033"
    ai:
      allow:
        - /
      disallow: []
      note: ""
      contact: ""

  content:
    math:
      enable: false
    toc:
      enable: false
    reading_time:
      enable: false
    citations:
      style: apa

  search:
    enable: false

  comments:
    enable: false

  analytics: {}
  verification: {}

  repository:
    enable: false

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  privacy:
    enable: false

  debug:
    enable: false

  pro:
    hide_attribution: false
