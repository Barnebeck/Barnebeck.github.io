bio: |
  I am a professor of economics at the [University of Southern Denmark (SDU)](https://www.sdu.dk/en).

  Before joining SDU, I was an assistant professor at the [University of Copenhagen](https://www.ku.dk/english/), an economist at [Danmarks Nationalbank](https://www.nationalbanken.dk/en), and then an associate professor at the University of Copenhagen.

  My current research interests span political economy and macroeconomics.

