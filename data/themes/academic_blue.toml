# Colour scheme modelled on the classic "Academic" theme look
name = "Academic Blue"

[light]
  primary = "#006699"
  menu_primary = "#fff"
  menu_text = "#34495e"
  menu_text_active = "#006699"
  menu_title = "#2b2b2b"
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(247, 247, 247)"

[dark]
  primary = "#4fb3e0"
  link = "#4fb3e0"
  link_hover = "#4fb3e0"
